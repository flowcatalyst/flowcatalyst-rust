# Cargo configuration for faster builds
#
# Linker setup:
#   macOS:  brew install llvm && export PATH="/opt/homebrew/opt/llvm/bin:$PATH"
#   Linux:  sudo apt install lld clang   (or: sudo dnf install lld clang)

# Use lld linker on Linux (much faster than default ld)
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-fuse-ld=lld"]

[target.aarch64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-fuse-ld=lld"]

# Use lld linker on macOS (requires: brew install llvm)
# Uncomment if you have lld installed
# [target.x86_64-apple-darwin]
# rustflags = ["-C", "link-arg=-fuse-ld=lld"]

# [target.aarch64-apple-darwin]
# rustflags = ["-C", "link-arg=-fuse-ld=lld"]

[build]
# Number of parallel jobs (adjust based on CPU cores)
# jobs = 8

[profile.dev]
# Faster debug builds - reduced debug info
debug = 1
# Keep some optimizations for faster runtime during dev
opt-level = 0

[profile.dev.package."*"]
# Optimize dependencies even in dev mode (they don't change often)
opt-level = 2

[profile.release]
# Thin LTO + single codegen unit — biggest size win for the binaries we
# ship to users. Measured trade-off vs `codegen-units = 16`: 57 MB vs
# 98 MB fc-dev (+41 MB), ~2x faster build. Build cost is paid once per
# release; download size is paid by every user on every `fc-dev upgrade`.
# Revisit only if Windows release builds become genuinely blocking.
lto = "thin"
codegen-units = 1

[env]
# fc-dev's embedded Postgres is the cluster Go's and Java's fcdev share
# (`<userDataDir>/flowcatalyst/embedded-pg/data`), which is PostgreSQL 18.
# `postgresql_embedded`'s build script bundles the newest release matching
# this requirement; unpinned it would take the next major the day theseus
# publishes it, and a PG 19 server refuses a PG 18 data directory. Moving
# the cluster to a new major is `fcdev db upgrade` (Go/Java), not a rebuild.
# An environment variable of the same name still wins (`force` is off).
POSTGRESQL_VERSION = "^18"
