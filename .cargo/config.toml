# Cargo configuration for faster builds
#
# Measurements behind these settings, and the recommended per-developer setup
# (sccache, OpenSSL): docs/plans/build-speed-2026-09-28.md. Rerun them with
# scripts/build-bench/. The build profiles are in the workspace Cargo.toml,
# so every build uses them (the Docker image copies no `.cargo/`).
#
# Linkers:
#   macOS: Xcode's linker (ld-prime, Xcode 15+) is the default and fast;
#          nothing to configure. `split-debuginfo = "unpacked"` is cargo's
#          macOS default already (debug info stays in the object files).
#   Linux: this file links with the system lld (install `lld`; the release
#          workflow does). mold is faster still for dev links: see the doc.

# Use lld linker on Linux (much faster than GNU ld)
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-fuse-ld=lld"]

[target.aarch64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-fuse-ld=lld"]

[build]
# Number of parallel jobs (adjust based on CPU cores)
# jobs = 8

[env]
# fc-dev's embedded Postgres is the cluster Go's and Java's fcdev share
# (`<userDataDir>/flowcatalyst/embedded-pg/data`), which is PostgreSQL 18.
# `postgresql_embedded`'s build script bundles the newest release matching
# this requirement; unpinned it would take the next major the day theseus
# publishes it, and a PG 19 server refuses a PG 18 data directory. Moving
# the cluster to a new major is `fcdev db upgrade` (Go/Java), not a rebuild.
# An environment variable of the same name still wins (`force` is off).
POSTGRESQL_VERSION = "^18"
