[package]
name = "fc-fnhost-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "FlowCatalyst function host: environment, logging, observability, reconciler, artifact stores, Sigstore verification and the function listeners (a drop-in for Java's fc-fnhost)"

[dependencies]
fc-function-abi = { path = "../fc-function-abi" }
# The manifest, RoutePattern and the JDK helpers: the platform's own model,
# as Java's host links the server's classes.
fc-function-model = { path = "../fc-function-model" }
fc-function-signing = { path = "../fc-function-signing" }

tokio = { workspace = true }
tokio-util = { workspace = true }
futures = { workspace = true }
axum = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
# Nothing here depends on key order (the workspace turns `preserve_order` on
# for every build; see the root Cargo.toml).
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { workspace = true }
sha2 = { workspace = true, features = ["oid"] }
hex = { workspace = true }
parking_lot = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
bytes = { workspace = true }
rand = { workspace = true }
url = { workspace = true }
indexmap = { workspace = true }
hmac = { workspace = true }
subtle = { workspace = true }

base64 = "0.22"
# ECR registry auth (owner decision #14), behind the `ecr` feature: pulls in
# the AWS SDK only when it is enabled (on by default in bin/fc-fnhost).
aws-sdk-ecr = { workspace = true, optional = true }
aws-config = { workspace = true, optional = true }
# The listeners (H5): HTTP/1.1 + h2c with graceful shutdown.
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server", "server-auto", "server-graceful", "tokio", "http1", "http2", "service"] }
http = "1"
http-body-util = "0.1"
# RS256 verification of platform bearer tokens (already in the lock via jsonwebtoken).
rsa = "0.9"
prometheus-client = "0.23"
gethostname = "1"
# The WASM runtime (H4): WASI 0.2 components on plain wasmtime, the engine the
# F0 density spike chose (docs/function-runner-density.md §6). Pinned exactly:
# a `.cwasm` is only valid for the wasmtime that wrote it, and the spike's
# numbers were measured on this release. Default features off: no wasm GC,
# threads, on-disk cache (the host keeps its own `.cwasm` cache) or profiling.
wasmtime = { version = "=49.0.1", default-features = false, features = ["std", "runtime", "async", "cranelift", "pooling-allocator", "component-model", "parallel-compilation", "addr2line", "demangle"] }
wasmtime-wasi = { version = "=49.0.1", default-features = false, features = ["p2"] }
wasmtime-wasi-http = { version = "=49.0.1", default-features = false, features = ["p2", "default-send-request"] }
# Load-time inspection of an artifact before compiling it (component or core
# module, imports, exports, declared memory); the version wasmtime 49 uses.
wasmparser = { version = "0.258", default-features = false, features = ["std", "component-model"] }

[features]
# `GetAuthorizationToken` against private ECR registries, on the default AWS
# credential chain (the host's task or instance role). Off leaves ECR hosts
# to the plain anonymous/Bearer/Basic flow, which fails Unauthorized unless
# `RegistryCredentials` carries a fixed credential for that host.
ecr = ["dep:aws-sdk-ecr", "dep:aws-config"]

[dev-dependencies]
# Test-only: hand-written components (WAT) for the load-refusal tests.
wat = "1"
tempfile = { workspace = true }
rand_core = { version = "0.6", features = ["getrandom"] }
# Test-only: the TestSigstore port (tests/support/sigstore.rs) builds its own
# root CA, leaf certificate and Merkle proofs to feed the reconciler tests
# that exercise fc-function-signing's verifier.
p256 = { version = "0.13", features = ["alloc", "ecdsa", "pkcs8", "std"] }
x509-cert = { version = "0.2", default-features = false, features = ["std"] }
der = { version = "0.7", features = ["std"] }
