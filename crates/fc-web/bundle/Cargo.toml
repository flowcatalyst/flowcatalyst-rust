[package]
name = "fc-web-bundle"
version.workspace = true
edition = "2024"
license.workspace = true
description = "Writes the Topcoat asset bundle for a binary that links fc-web"
publish = false

# A separate crate, not a bin in fc-web: Topcoat's asset macros switch to
# `::topcoat_asset` paths whenever `topcoat-asset` is a direct dependency.
[dependencies]
topcoat-asset = { version = "0.9.0", features = ["bundler"] }
