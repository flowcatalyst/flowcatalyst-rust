[package]
name = "fc-web"
version.workspace = true
edition = "2024"
license.workspace = true
description = "FlowCatalyst server-rendered admin UI (Topcoat trial)"

[dependencies]
fc-platform = { path = "../fc-platform" }
topcoat = { version = "0.9.0", features = ["tower", "tailwind", "icon-iconify"] }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tower = { workspace = true }
http = "1"
http-body = "1"
form_urlencoded = "1"
bytes = "1"
chrono = { workspace = true }
tracing = { workspace = true }

[build-dependencies]
topcoat = { version = "0.9.0", default-features = false, features = ["tailwind", "icon-iconify"] }
