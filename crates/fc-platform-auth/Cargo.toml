[package]
name = "fc-platform-auth"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "FlowCatalyst Platform - the sign-in flows: OAuth/OIDC, sessions, refresh tokens, password reset, two-factor login, passkeys, the portal login plane"

[dependencies]
# The kernel, and the platform crates this one builds on.
fc-platform-core = { path = "../fc-platform-core" }
fc-platform-iam = { path = "../fc-platform-iam" }

# Async runtime
tokio = { workspace = true }
async-trait = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }

# Database (PostgreSQL)
sqlx = { workspace = true, features = ["postgres", "macros", "json"] }

# Web framework
axum = { workspace = true }
axum-extra = { workspace = true }
utoipa = { workspace = true }

# Authentication
jsonwebtoken = { workspace = true }
hmac = "0.12"
sha2 = "0.10"
# Two-factor authentication (TOTP, RFC 6238, as Go's pquerna/otp): SHA-1
# HOTP, the base32 shared secret, and the enrolment QR code rendered as a PNG.
sha1 = "0.10"
data-encoding = "2"
qrcodegen = "1.8"
flate2 = "1"
crc32fast = "1"
base64 = "0.22"
rand = { workspace = true }
webauthn-rs = { workspace = true }

## webauthn-rs-core pulls `openssl` for attestation crypto — that's a
## hard dep of the crate, not switchable. Adding it here with the
## `vendored` feature flips `openssl-sys` to build OpenSSL from source
## via the `openssl-src` crate instead of linking against a system
## install. Net effect: the Windows release CI no longer needs
## `vcpkg install openssl:x64-windows-static-md` — the openssl-src
## build artifact lands in target/ and gets reused via rust-cache.
## On Linux/macOS the first build is ~1-2 min slower (one-off),
## subsequent builds hit the cache and are unchanged.
##
## This dep is unused by this crate's own code; the feature
## propagates through workspace-wide unification to webauthn-rs's
## openssl pull. Keep it here (not in fc-server) so dev builds in
## this crate get the same toolchain shape as release builds.
openssl = { version = "0.10", features = ["vendored"] }

# HTTP client for OIDC. Inherit from workspace so we pick up the
# `default-features = false` + rustls-tls posture; declaring our own
# reqwest here used to re-enable `default-tls` via feature unification
# and drag OpenSSL/native-tls back into every binary.
reqwest = { workspace = true }
urlencoding = "2.1"

# Utilities
uuid = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
time = "0.3"

# Regex for pattern matching
regex = { workspace = true }

subtle = { workspace = true }
hex = { workspace = true }

[dev-dependencies]
# `InMemoryUnitOfWork` and `assert_str_enum` for the unit tests.
fc-platform-core = { path = "../fc-platform-core", features = ["test-support"] }
tokio = { workspace = true, features = ["full"] }
rsa = { version = "0.9", features = ["pem"] }

[lints]
workspace = true
