[package]
name = "fc-router"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
fc-common = { path = "../fc-common" }
fc-queue = { path = "../fc-queue" }
fc-standby = { path = "../fc-standby" }
fc-stream = { path = "../fc-stream" }
tokio = { workspace = true }
tokio-util = { workspace = true }
async-trait = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
reqwest = { workspace = true }
url = { workspace = true }
arc-swap = { workspace = true }
dashmap = { workspace = true }
indexmap = { workspace = true }
futures = { workspace = true }
governor = { workspace = true }
hdrhistogram = { workspace = true }
nonzero_ext = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
utoipa = { workspace = true }
utoipa-swagger-ui = { workspace = true }
utoipa-axum = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
axum = { workspace = true }
axum-extra = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
base64 = "0.22"
rand = { workspace = true }
# failsafe removed — circuit breaking now handled by CircuitBreakerRegistry
urlencoding = "2.1"
jsonwebtoken = { workspace = true }
lettre = { workspace = true, optional = true }
aws-sdk-elasticloadbalancingv2 = { workspace = true, optional = true }
aws-config = { workspace = true, optional = true }
aws-sdk-sqs = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }

[features]
default = []
email = ["dep:lettre"]
alb = ["dep:aws-sdk-elasticloadbalancingv2", "dep:aws-config"]
oidc-flow = []
# The broker consumer factory + SQS publisher the router binaries share
# (`bootstrap::SchemeConsumerFactory`, `bootstrap::SqsPublisher`).
backends = [
    "fc-queue/sqs",
    "fc-queue/postgres",
    "fc-queue/nats",
    "dep:aws-sdk-sqs",
    "dep:aws-config",
    "dep:sqlx",
]

[dev-dependencies]
tokio-test = { workspace = true }
wiremock = { workspace = true }
tempfile = { workspace = true }
tracing-subscriber = { workspace = true }
bytes = { workspace = true }
# For axum-level operator-surface-endpoint tests (tower::ServiceExt::oneshot
# + reading the response body) — same version fc-platform's own API test
# support module already uses.
http-body-util = "0.1"
# Item 3's mediation-protocol tests need raw servers wiremock can't give us:
# an h2c (HTTP/2 cleartext, prior-knowledge) server, and a server that ONLY
# understands HTTP/1.1 so an h2c preface sent at it genuinely fails rather
# than silently downgrading. Pinned to the exact hyper/hyper-util versions
# axum 0.8 already resolves in this workspace (Cargo.lock) so there's no
# second hyper version in the dependency graph.
hyper = { version = "=1.9.0", features = ["server", "http1", "http2"] }
hyper-util = { version = "=0.1.20", features = ["tokio", "server", "server-auto"] }
