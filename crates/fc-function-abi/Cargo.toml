[package]
name = "fc-function-abi"
version.workspace = true
edition.workspace = true
authors.workspace = true
# Shared by the function host (AGPL) and the guest PDK (an SDK), so it takes the
# SDK licence, like fc-sdk.
license = "MPL-2.0"
description = "FlowCatalyst function ABI: the guest-facing types of Java's function-api"
repository = "https://github.com/flowcatalyst/flowcatalyst-rust"
keywords = ["flowcatalyst", "wasm", "functions", "serverless"]
categories = ["wasm", "api-bindings"]
# Published to crates.io as a dependency of fc-function-pdk: only the crate
# itself. The tests read the Java golden files and link the platform (a
# path-only dev-dependency, dropped on publish).
include = ["src/**/*.rs", "Cargo.toml", "LICENSE"]

[dependencies]
# No tokio, no std-only I/O: this crate must build for wasm32-unknown-unknown.
indexmap = { workspace = true }
thiserror = { workspace = true }
# Not the workspace's serde_json: that one has `preserve_order`, which a guest
# (the PDK links this crate) has no use for. raw_value: a webhook's `data` /
# `payload` pass through as their raw text.
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
# Default features off: no clock, so nothing that needs a JS host on
# wasm32-unknown-unknown.
chrono = { version = "0.4", default-features = false, features = ["alloc"] }

[dev-dependencies]
# Agreement test: the guest-side permission rule against the platform's own.
fc-platform = { path = "../fc-platform" }
