[package]
name = "fc-function-abi"
version.workspace = true
edition.workspace = true
authors.workspace = true
# Shared by the function host (AGPL) and the guest PDK (an SDK), so it takes the
# SDK licence, like fc-sdk.
license = "MPL-2.0"
description = "FlowCatalyst function ABI: the guest-facing types of Java's function-api"

[dependencies]
# No tokio, no std-only I/O: this crate must build for wasm32-unknown-unknown.
indexmap = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
# raw_value: a webhook's `data` / `payload` pass through as their raw text.
serde_json = { workspace = true, features = ["raw_value"] }
# Default features off: no clock, so nothing that needs a JS host on
# wasm32-unknown-unknown.
chrono = { version = "0.4", default-features = false, features = ["alloc"] }

[dev-dependencies]
# Agreement test: the guest-side permission rule against the platform's own.
fc-platform = { path = "../fc-platform" }
