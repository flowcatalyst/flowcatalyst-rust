[package]
name = "fc-function-signing"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "FlowCatalyst function artifact signatures: a port of Java's JDK-only Sigstore bundle verifier, shared by the platform (publish) and the function host (load)"

[dependencies]
# `Digest` / `SignerIdentity` and the JDK helpers, shared with the platform
# and the host.
fc-function-model = { path = "../fc-function-model" }
serde_json = { workspace = true }
chrono = { workspace = true }
sha2 = { workspace = true, features = ["oid"] }
hex = { workspace = true }
base64 = "0.22"
# The RustCrypto stack already in the lock file (see signature/mod.rs for why
# this is a port rather than sigstore-rs).
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "pkcs8", "std"] }
p384 = { version = "0.13", default-features = false, features = ["ecdsa", "pkcs8", "std"] }
x509-cert = { version = "0.2", default-features = false, features = ["std"] }
der = { version = "0.7", features = ["std"] }

[dev-dependencies]
rand_core = { version = "0.6", features = ["getrandom"] }
# Test-only: SPKI encoding for the TestSigstore port's generated keys.
p256 = { version = "0.13", features = ["alloc"] }
