[package]
name = "fc-common"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# Apache-2.0: the types fc-sdk shares with the platform (re-exported).
fc-common-types = { path = "../fc-common-types" }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
utoipa = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
url = { workspace = true }
# The OTLP span exporter (feature `otel`, off by default): OTLP/HTTP
# protobuf over the workspace's reqwest, not a second HTTP stack.
opentelemetry = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
opentelemetry-http = { workspace = true, optional = true }
tracing-opentelemetry = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
# The dispatch-job lifecycle's SQL and refusal counter (feature `dispatch-lifecycle`).
sqlx = { workspace = true, features = ["postgres"], optional = true }
metrics = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[target.'cfg(unix)'.dependencies]
# getrusage/getrlimit for the process metrics.
libc = { workspace = true }

[features]
default = []
# The dispatch-job lifecycle (`dispatch_lifecycle`): the one owner of
# `msg_dispatch_jobs.status`. Lives here, not in the messaging crate, because
# fc-stream's fan-out writes jobs too and cannot depend on that crate.
dispatch-lifecycle = ["dep:sqlx", "dep:metrics"]
# Task dumps (`Handle::dump`). Also needs RUSTFLAGS="--cfg tokio_unstable";
# the production image builds with both (Dockerfile, FC_TASKDUMP).
taskdump = ["tokio/taskdump"]
# Name resolution and redirects for a reqwest client that refuses the
# addresses the delivery policy forbids (`netguard::http`). On for the crates
# that POST to customer URLs.
guarded-http = ["dep:reqwest"]
# OTLP span export, started by FC_OTEL_ENABLED=true.
otel = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:opentelemetry-http",
    "dep:tracing-opentelemetry",
    "dep:reqwest",
]

[lints.rust]
# `tokio_unstable` is set by RUSTFLAGS for the task-dump build.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tokio_unstable)'] }

[lints.clippy]
# Imports, not inline paths (CLAUDE.md "Imports"): `use std::sync::Arc;`
# and `Arc`, not `std::sync::Arc`. Limits in clippy.toml.
absolute_paths = "warn"
