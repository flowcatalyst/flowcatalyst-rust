[package]
name = "fc-outbox"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
fc-common = { path = "../fc-common" }
fc-standby = { path = "../fc-standby", optional = true }
tokio = { workspace = true }
sqlx = { workspace = true, optional = true }
mongodb = { workspace = true, optional = true }
futures = { version = "0.3", optional = true }
chrono = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
bson = { version = "2.9", features = ["chrono-0_4"], optional = true }
reqwest = { workspace = true }
# The group admin API (`setup::admin_router`), behind the `admin` feature.
axum = { workspace = true, optional = true }

[dev-dependencies]
# The SQLite, PostgreSQL and MySQL repositories are always built for tests.
sqlx = { workspace = true, features = ["sqlite", "postgres", "mysql"] }
axum = { workspace = true }
testcontainers = { workspace = true }
testcontainers-modules = { workspace = true, features = ["mysql"] }
tower = { workspace = true }

[features]
sqlite = ["dep:sqlx", "sqlx/sqlite"]
postgres = ["dep:sqlx", "sqlx/postgres"]
mysql = ["dep:sqlx", "sqlx/mysql"]
mongo = ["dep:mongodb", "dep:bson", "dep:futures"]
standby = ["dep:fc-standby"]
admin = ["dep:axum"]

[lints.clippy]
# Imports, not inline paths (CLAUDE.md "Imports"): `use std::sync::Arc;`
# and `Arc`, not `std::sync::Arc`. Limits in clippy.toml.
absolute_paths = "warn"
