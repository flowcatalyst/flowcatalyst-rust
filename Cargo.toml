[workspace]
members = [
    "crates/fc-common",
    "crates/fc-queue",
    "crates/fc-router",
    "crates/fc-standby",
    "crates/fc-outbox",
    "crates/fc-stream",
    "crates/fc-platform",
    "crates/fc-sdk",
    "crates/fc-mcp",
    "crates/fc-function-abi",
    "crates/fc-function-model",
    "crates/fc-fnhost-core",
    "crates/fc-fnhost-js",
    "crates/fc-function-signing",
    "crates/fc-http-listener",
    "crates/fc-platform-jwks",
    "bin/fc-dev",
    "bin/fc-outbox-processor",
    "bin/fc-server",
    "harness/parity",
    "harness/delivery",
]
# Their own Cargo workspaces, built for wasm targets (templates/ holds a
# `cargo generate` template, not buildable until rendered).
exclude = [
    "crates/fc-fnhost-core/tests/guests",
    "crates/fc-function-pdk",
    # The Topcoat UI trial: only fc-dev's optional `web` feature builds it,
    # so `--workspace` builds, CI and the Docker image never compile it (its
    # build script downloads Tailwind). See docs/topcoat-trial.md.
    "crates/fc-web",
    "examples",
    "spikes",
    "templates",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["FlowCatalyst Team"]
license = "AGPL-3.0-or-later"

[workspace.dependencies]
tokio = { version = "1.44", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
serde = { version = "1.0", features = ["derive"] }
# `preserve_order` is on for every build, deliberately. bson (fc-outbox's
# `mongo` feature, in fc-dev and fc-outbox-processor) turns it on and cannot
# be told not to, so with it off here Cargo's feature unification would
# decide per binary: on under fc-dev and `cargo test --workspace`, off in
# fc-server and fc-router. On everywhere, CI tests what production ships.
# Nothing depends on the order: `Value` maps just keep insertion order.
serde_json = { version = "1.0", features = ["preserve_order"] }
axum = "0.8"
axum-extra = { version = "0.10", features = ["cookie"] }
## NOTE: `default-features = false` is load-bearing.
##
## reqwest's default `default-tls` feature pulls in `native-tls`/openssl
## even when `rustls-tls` is also enabled — they're additive, not
## exclusive. That made every workspace binary link against OpenSSL on
## Windows, which forced a `vcpkg install openssl:x64-windows-static-md`
## step in release-fc-dev.yml that dominated the Windows CI runtime.
## With defaults off, only rustls is wired in; nothing in the workspace
## (or our transitive deps as of writing — see `cargo tree -i native-tls`)
## links OpenSSL anymore. Confirm with that command before adding any new
## reqwest feature flag.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "charset", "http2", "system-proxy"] }
# No database driver here: each crate enables the drivers it uses
# (`features = ["postgres"]`, or per feature in fc-outbox, fc-queue and
# fc-sdk), so a crate that only speaks Postgres does not compile SQLite's C
# sources or the MySQL driver. Defaults off: nothing uses the `Any` driver,
# `migrate` or the `query!` macros (only `#[derive(FromRow)]`).
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "derive", "chrono", "uuid"] }
mongodb = "3.2"
bson = { version = "2.15", features = ["chrono-0_4"] }
## AWS SDK: one HTTP client and one TLS stack for every service.
##
## Each service's default `rustls` feature is the *legacy* connector
## (hyper 0.14 + rustls 0.21 + h2 0.3). With `BehaviorVersion::latest()`,
## which every client here is built with, the SDK uses the
## `default-https-client` (hyper 1 + rustls 0.23) and never the legacy one,
## so `rustls` only compiled a second, unused HTTP/TLS stack. Defaults off,
## `rt-tokio` + `default-https-client` on every service.
aws-sdk-sqs = { version = "1.91", default-features = false, features = ["rt-tokio", "default-https-client"] }
aws-sdk-secretsmanager = { version = "1.78", default-features = false, features = ["rt-tokio", "default-https-client"] }
aws-sdk-s3 = { version = "1", default-features = false, features = ["rt-tokio", "default-https-client", "http-1x"] }
# The fnhost `ecr` feature (owner decision #14): `GetAuthorizationToken`
# against a private ECR registry, on the host's own IAM role.
aws-sdk-ecr = { version = "1", default-features = false, features = ["rt-tokio", "default-https-client"] }
# aws-config's own defaults, spelled out: the SSO and credential-process
# providers stay (local AWS profiles use them).
aws-config = { version = "1.8", default-features = false, features = ["rt-tokio", "default-https-client", "credentials-process", "sso"] }
aes-gcm = "0.10"
async-trait = "0.1"
anyhow = "1.0"
thiserror = "2.0"
# Typed builders for aggregates built from many optional parts.
bon = "3.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1.16", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
# Diagnostics (docs/operations/diagnosing-stuck-processes.md), each behind
# an off-by-default fc-common feature: OTLP span export (`otel`, over the
# workspace's reqwest: six crates) and tokio-console (`tokio-console`: three).
opentelemetry = { version = "0.33", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["trace", "http-proto"] }
opentelemetry-http = { version = "0.33", default-features = false }
tracing-opentelemetry = { version = "0.34", default-features = false }
console-subscriber = { version = "0.5", default-features = false }
# getrusage/getrlimit for the process metrics.
libc = { version = "0.2", default-features = false }
metrics = "0.24"
metrics-exporter-prometheus = "0.16"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["full"] }
dashmap = "6.1"
indexmap = "2.8"
governor = "0.8"
hdrhistogram = "7.5"
rust-embed = "8.7"
nonzero_ext = "0.3"
# TLS (`rediss://`) as Go's go-redis accepts it: production's REDIS_URL is an
# ElastiCache `rediss://` endpoint. The rustls config it builds needs a
# process-level crypto provider, which the binaries install at startup.
redis = { version = "0.29", features = ["tokio-comp", "connection-manager", "tokio-rustls-comp", "tls-rustls-webpki-roots"] }
parking_lot = "0.12"
futures = "0.3"
bytes = "1.10"
hmac = "0.12"
sha2 = "0.10"
subtle = "2.6"
hex = "0.4"
pin-project-lite = "0.2"
url = "2"
arc-swap = "1"
lapin = "2.5"
async-nats = "0.50"
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "builder", "smtp-transport"] }
openidconnect = "4.0"
aws-sdk-elasticloadbalancingv2 = { version = "1.91", default-features = false, features = ["rt-tokio", "default-https-client"] }
regex = "1.11"
rand = "0.9"
failsafe = "1.3"
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
webauthn-rs = { version = "0.5", features = ["danger-allow-state-serialisation"] }

# OpenAPI documentation
utoipa = { version = "5.3", features = ["axum_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }
utoipa-axum = "0.2"

# Test dependencies
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["localstack", "redis", "postgres", "nats"] }
wiremock = "0.6"
tokio-test = "0.4"
tempfile = "3.19"
