[package]
name = "fnhost-density"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
# (a) the extism crate, current stable, pinned. Built-in http off: the spike shadows http_request.
extism = { version = "=1.30.0", default-features = false, features = ["wasmtime-default-features"] }
# (b) + (c): plain wasmtime, current stable, pinned.
wasmtime = { version = "=49.0.1" }
wasmtime43 = { package = "wasmtime", version = "=43.0.2" }
wasmtime-wasi = { version = "=49.0.1" }
wasmtime-wasi-http = { version = "=49.0.1" }
anyhow = "1"
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
hex = "0.4"
libc = "0.2"
tokio = { version = "1", features = ["full"] }
ureq = { version = "3", default-features = false }
http = "1"
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
bytes = "1"
