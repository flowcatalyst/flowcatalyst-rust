# cargo-deny policy for the FlowCatalyst workspace.
#
# Run: `cargo deny check` (CI's `supply-chain` job runs it on every push and
# pull request). The SDK crates have their own, stricter licence policy in
# `deny-sdk.toml`. See docs/operations/supply-chain.md for how to add a
# dependency and what to do when a check fails.

[graph]
# Every crate any build can include: the binaries' optional features (fc-dev's
# `web`, the router's `alb`/`email`, fc-sdk's backends, ...) and dev
# dependencies. The targets are the ones we ship.
all-features = true
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]

[output]
feature-depth = 1

# ── RustSec advisories ──────────────────────────────────────────────────
# Vulnerabilities, unsound crates and unmaintained crates all fail the check,
# direct or transitive. An `ignore` entry needs a reason that says why the
# advisory cannot reach us or why no fix is possible yet, and should be
# revisited when the reason changes.
[advisories]
unmaintained = "all"
unsound = "all"
yanked = "deny"
ignore = [
    # rsa: Marvin attack, timing side channel in the private-key
    # operations (RUSTSEC-2023-0071); no fixed release exists. Shipped. The
    # platform never decrypts with RSA: it signs its JWTs (RS256, through
    # jsonwebtoken's rust_crypto backend) and verifies tokens, signatures and
    # certificates. Verification uses only the public key; the exposure is
    # the signing path, which needs many precisely timed signing requests
    # measured close to the host. Revisit when rsa 0.10 is released, or move
    # JWT signing to an aws-lc-rs backend.
    { id = "RUSTSEC-2023-0071", reason = "no fix; RSA used for signing/verifying only, never decryption (see comment)" },
    # quick-xml 0.23 (RUSTSEC-2026-0194, RUSTSEC-2026-0195): fc-dev only,
    # through self_update 0.41, whose S3 backend is its only XML parser.
    # fc-dev upgrades from GitHub releases (the github backend, JSON); the
    # parser never runs. self_update 1.x drops it but changes the upgrade
    # flow (reqwest 0.13, semver-parsed tags) and needs its own change.
    { id = "RUSTSEC-2026-0194", reason = "fc-dev only; self_update's S3 backend, never used (github backend)" },
    { id = "RUSTSEC-2026-0195", reason = "fc-dev only; self_update's S3 backend, never used (github backend)" },
    # number_prefix: unmaintained (RUSTSEC-2025-0119), no fix. fc-dev only,
    # through self_update 0.41's indicatif 0.17 (the upgrade progress bar):
    # formats byte counts. Goes with the self_update 1.x move above.
    { id = "RUSTSEC-2025-0119", reason = "unmaintained, fc-dev's upgrade progress bar only" },
    # paste: unmaintained (RUSTSEC-2024-0436), no fix. A proc-macro run at
    # build time by utoipa-axum 0.2 (and pastey elsewhere); no runtime code.
    # utoipa-axum 0.3 moves to pastey but needs utoipa 6, a migration of the
    # published OpenAPI documents.
    { id = "RUSTSEC-2024-0436", reason = "unmaintained build-time proc-macro (utoipa-axum 0.2)" },
    # instant (RUSTSEC-2024-0384, unmaintained) is in Cargo.lock for wasm
    # targets only (fastrand 1.x, parking_lot 0.11), none of the targets
    # above, so cargo-deny never meets it; `cargo audit`, which reads the
    # lockfile, ignores it in .cargo/audit.toml.
    # rustls-pemfile: unmaintained (RUSTSEC-2025-0134), no fix in lapin 2.x.
    # In no shipped binary: lapin (fc-queue's `activemq` feature, enabled by
    # no binary). Moving the feature to lapin 4 is its own change.
    { id = "RUSTSEC-2025-0134", reason = "unmaintained; only lapin (fc-queue activemq), which no binary enables" },
]

# ── Licences ────────────────────────────────────────────────────────────
# The platform is AGPL-3.0-or-later. Everything it links must be
# AGPL-compatible: permissive licences, MPL-2.0 (file-level copyleft;
# compatible through its secondary-licence clause) and the data licences
# below. A copyleft licence other than MPL-2.0 needs review before it is
# added here.
[licenses]
confidence-threshold = 0.9
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "CC0-1.0",
    "BSL-1.0",
    "Unlicense",
    "MPL-2.0",
    # Unicode data tables (icu_*, unicode-ident).
    "Unicode-3.0",
    # Mozilla's CA root list (webpki-roots).
    "CDLA-Permissive-2.0",
    # The embedded PostgreSQL fc-dev bundles (postgresql_embedded).
    "PostgreSQL",
]
# Our own crates. Each is listed so a third-party AGPL/GPL crate still
# fails the check until someone decides it is acceptable.
exceptions = [
    { crate = "fc-common", allow = ["AGPL-3.0-or-later"] },
    { crate = "fc-delivery-harness", allow = ["AGPL-3.0-or-later"] },
    { crate = "fc-dev", allow = ["AGPL-3.0-or-later"] },
    { crate = "fc-fnhost-core", allow = ["AGPL-3.0-or-later"] },
    { crate = "fc-fnhost-js", allow = ["AGPL-3.0-or-later"] },
    { crate = "fc-function-signing", allow = ["AGPL-3.0-or-later"] },
    { crate = "fc-http-listener", allow = ["AGPL-3.0-or-later"] },
    { crate = "fc-mcp", allow = ["AGPL-3.0-or-later"] },
    { crate = "fc-outbox", allow = ["AGPL-3.0-or-later"] },
    { crate = "fc-outbox-processor", allow = ["AGPL-3.0-or-later"] },
    { crate = "fc-parity", allow = ["AGPL-3.0-or-later"] },
    { crate = "fc-platform", allow = ["AGPL-3.0-or-later"] },
    { crate = "fc-platform-core", allow = ["AGPL-3.0-or-later"] },
    { crate = "fc-platform-functions", allow = ["AGPL-3.0-or-later"] },
    { crate = "fc-platform-iam", allow = ["AGPL-3.0-or-later"] },
    { crate = "fc-platform-jwks", allow = ["AGPL-3.0-or-later"] },
    { crate = "fc-platform-messaging", allow = ["AGPL-3.0-or-later"] },
    { crate = "fc-platform-scheduled-jobs", allow = ["AGPL-3.0-or-later"] },
    { crate = "fc-queue", allow = ["AGPL-3.0-or-later"] },
    { crate = "fc-router", allow = ["AGPL-3.0-or-later"] },
    { crate = "fc-server", allow = ["AGPL-3.0-or-later"] },
    { crate = "fc-standby", allow = ["AGPL-3.0-or-later"] },
    { crate = "fc-stream", allow = ["AGPL-3.0-or-later"] },
    { crate = "fc-web", allow = ["AGPL-3.0-or-later"] },
]

[licenses.private]
ignore = false

# ── Bans ────────────────────────────────────────────────────────────────
[bans]
# Two versions of one crate in the graph fail the check unless listed in
# `skip` with the reason (usually: which dependency still needs the old one).
multiple-versions = "deny"
# Our path dependencies carry no version, which cargo-deny counts as a
# wildcard for crates not marked `publish = false`; every crates.io
# dependency has a version requirement, and `[sources]` keeps it that way.
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
deny = [
    # TLS is rustls everywhere (see the reqwest note in Cargo.toml).
    { crate = "native-tls", reason = "TLS is rustls; native-tls links the system OpenSSL/Schannel/Security.framework" },
    { crate = "hyper-tls", reason = "native-tls through hyper; use hyper-rustls" },
    { crate = "tokio-native-tls", reason = "native-tls through tokio; use tokio-rustls" },
    # OpenSSL only where webauthn-rs needs it for attestation, vendored
    # (fc-platform-iam, which holds webauthn, turns on `vendored`).
    { crate = "openssl", wrappers = ["fc-platform", "fc-platform-iam", "webauthn-rs-core", "webauthn-attestation-ca"], reason = "rustls everywhere else" },
    # Unmaintained or unsound, with maintained replacements.
    { crate = "atty", reason = "unsound (RUSTSEC-2021-0145) and unmaintained; use std::io::IsTerminal" },
    { crate = "failure", reason = "unmaintained; use thiserror/anyhow" },
    { crate = "serde_yaml", reason = "unmaintained; use serde_norway" },
]
skip = [
    # The duplicates as of 2026-09-28, each with who still holds the older
    # version (generated from `cargo tree -i`). Remove an entry when its
    # holders move; `cargo deny check` warns about entries that no longer
    # match. Adding one means: nothing we control can move to the newer
    # version yet.
