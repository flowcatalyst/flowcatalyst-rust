    { crate = "asn1-rs-derive@0.5.1", reason = "0.6.0 elsewhere; asn1-rs still on 0.5.1" },
    { crate = "async-io@1.13.0", reason = "2.6.0 elsewhere; async-reactor-trait still on 1.13.0" },
    { crate = "async-lock@2.8.0", reason = "3.4.2 elsewhere; async-io still on 2.8.0" },
    { crate = "base64@0.21.7", reason = "0.23.1 elsewhere; base64urlsafedata, docker_credential, hdrhistogram, webauthn-rs-core and 1 more still on 0.21.7" },
    { crate = "base64@0.22.1", reason = "0.23.1 elsewhere; async-nats, bollard, bollard-stubs, bson and 31 more still on 0.22.1" },
    { crate = "bitflags@1.3.2", reason = "2.13.2 elsewhere; polling, rustix still on 1.3.2" },
