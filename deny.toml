    { crate = "core-foundation@0.9.4", reason = "0.10.1 elsewhere; security-framework, system-configuration still on 0.9.4" },
    { crate = "cpufeatures@0.2.17", reason = "0.3.0 elsewhere; aes, argon2, curve25519-dalek, polyval and 2 more still on 0.2.17" },
    { crate = "crypto-common@0.1.7", reason = "0.2.2 elsewhere; aead, cipher, digest, universal-hash still on 0.1.7" },
    { crate = "darling@0.23.0", reason = "0.24.1 elsewhere; rmcp-macros, serde_with_macros still on 0.23.0" },
    { crate = "darling_core@0.23.0", reason = "0.24.1 elsewhere; darling, darling_macro still on 0.23.0" },
