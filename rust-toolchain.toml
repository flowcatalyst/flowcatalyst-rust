# The toolchain every build uses, so a new stable release cannot change what
# CI, the Docker image and a developer's machine compile (new lints, new
# warnings). Bump it deliberately: change the channel here, `rust-version` in
# the root Cargo.toml, the Dockerfile's cargo-chef tag and the `toolchain:`
# of the dtolnay/rust-toolchain steps in .github/workflows, in one commit.
[toolchain]
channel = "1.98.1"
components = ["clippy", "rustfmt"]
profile = "minimal"
