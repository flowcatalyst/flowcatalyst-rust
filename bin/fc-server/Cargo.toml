[package]
name = "fc-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "FlowCatalyst Unified Production Server - all subsystems in one binary"

[[bin]]
name = "fc-server"
path = "src/main.rs"

[dependencies]
mimalloc = { workspace = true }
fc-common = { path = "../../crates/fc-common" }
fc-platform = { path = "../../crates/fc-platform" }
fc-router = { path = "../../crates/fc-router", features = ["backends"] }
fc-standby = { path = "../../crates/fc-standby" }
fc-stream = { path = "../../crates/fc-stream" }
# The outbox role reads Postgres and MySQL outboxes (owner decision #52):
# SQLite and MongoDB are fc-outbox-processor's (and fc-dev's) only, so the
# production binary builds no SQLite C sources. main.rs refuses both at
# startup (`fc_server_outbox_backend`).
fc-outbox = { path = "../../crates/fc-outbox", features = ["postgres", "mysql", "admin"] }
fc-mcp = { path = "../../crates/fc-mcp" }
# The function-host role. `ecr`: ECR registry auth for oci:// artifacts
# (owner decision #14), as the former fc-fnhost binary had it.
fc-fnhost-core = { path = "../../crates/fc-fnhost-core", features = ["ecr", "aws-secrets"] }
# The function host's JS runtime (runtime: js, V8 isolates), behind the
# default `js` feature: off, the host loads WASI components only and the
# binary carries no V8.
fc-fnhost-js = { path = "../../crates/fc-fnhost-js", optional = true }

tokio = { workspace = true }
tokio-util = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
sqlx = { workspace = true, features = ["postgres"] }
aws-config = { workspace = true }
aws-sdk-secretsmanager = { workspace = true }
reqwest = { workspace = true }
rustls = "0.23"
urlencoding = "2.1"
regex = { workspace = true }
utoipa = { workspace = true }
utoipa-swagger-ui = { workspace = true }
utoipa-axum = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
axum = { workspace = true }
reqwest = { workspace = true }
serde_json = { workspace = true }
parking_lot = { workspace = true }
testcontainers = { workspace = true }
testcontainers-modules = { workspace = true }
rsa = { version = "0.9", features = ["pem"] }
# The function-host role tests (fc-fnhost-core's fake platform).
sha2 = { workspace = true }
hex = { workspace = true }
tempfile = { workspace = true }
# The JVM function e2e (tests/it/jvm_function_host_e2e.rs) signs its artifacts
# with fc-function-signing's TestSigstore port, whose sources it includes.
fc-function-signing = { path = "../../crates/fc-function-signing" }
chrono = { workspace = true }
base64 = "0.22"
der = { version = "0.7", features = ["std"] }
p256 = { version = "0.13", features = ["ecdsa", "pkcs8", "alloc"] }
rand_core = { version = "0.6", features = ["getrandom"] }
x509-cert = { version = "0.2", default-features = false, features = ["std"] }

[features]
default = ["js"]
# The function host's JS runtime (fc-fnhost-js, V8 through deno_core).
js = ["dep:fc-fnhost-js"]
# The router role's optional extras (formerly the standalone fc-router's):
# ALB self-registration, e-mail notifications, the OIDC-flow router UI auth.
alb = ["fc-router/alb"]
email = ["fc-router/email"]
oidc-flow = ["fc-router/oidc-flow"]
# Diagnostics (docs/operations/diagnosing-stuck-processes.md). `taskdump`
# also needs RUSTFLAGS="--cfg tokio_unstable" and builds on Linux only: the
# production image turns both on (Dockerfile, FC_TASKDUMP). `otel` needs
# FC_OTEL_ENABLED=true.
taskdump = ["fc-common/taskdump"]
otel = ["fc-common/otel"]

[lints.clippy]
# Imports, not inline paths (CLAUDE.md "Imports"): `use std::sync::Arc;`
# and `Arc`, not `std::sync::Arc`. Limits in clippy.toml.
absolute_paths = "warn"
