[package]
name = "fc-outbox-processor"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "FlowCatalyst Outbox Processor - Reads from app database outbox and sends to FlowCatalyst API"

[dependencies]
fc-common = { path = "../../crates/fc-common" }
# Every backend: consumer applications keep their outbox in SQLite,
# PostgreSQL, MySQL or MongoDB.
fc-outbox = { path = "../../crates/fc-outbox", features = ["sqlite", "postgres", "mysql", "mongo", "admin"] }

tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# tests/mysql_backend_test.rs: the binary against a MySQL container.
sqlx = { workspace = true, features = ["mysql"] }
testcontainers = { workspace = true }
testcontainers-modules = { workspace = true, features = ["mysql"] }

[features]
# Diagnostics (docs/operations/diagnosing-stuck-processes.md): OTLP span
# export (FC_OTEL_ENABLED=true).
otel = ["fc-common/otel"]

[lints.clippy]
# Imports, not inline paths (CLAUDE.md "Imports"): `use std::sync::Arc;`
# and `Arc`, not `std::sync::Arc`. Limits in clippy.toml.
absolute_paths = "warn"
