name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  # fc-dev's build.rs invokes `pnpm build` to embed the frontend into the
  # binary via rust-embed. For clippy / test we don't need a real bundle,
  # just enough that the `#[folder = "../../frontend/dist/"]` macro finds
  # a non-empty directory. Each Rust job creates a stub before invoking
  # cargo, then exports this flag to skip the actual build.
  FC_SKIP_FRONTEND_BUILD: "1"

jobs:
  check:
    name: Check & Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          # Keep in step with rust-toolchain.toml (the pin).
          toolchain: 1.98.1
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Stub frontend/dist (skip-build mode)
        run: |
          mkdir -p frontend/dist
          # rust-embed will fail on an empty directory in some versions;
          # a placeholder index.html keeps the macro happy.
          echo "<!doctype html><title>stub</title>" > frontend/dist/index.html

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      - name: Check formatting
        run: cargo fmt --all -- --check

  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      # Split DWARF: each test executable keeps a skeleton and the line
      # tables, the rest goes to `.dwo` files beside the objects; half the
      # size, backtraces keep file:line (docs/plans/build-speed-2026-09-28.md,
      # section 4.2). Linux only, so set here rather than in the profile.
      CARGO_PROFILE_DEV_SPLIT_DEBUGINFO: unpacked
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          # Keep in step with rust-toolchain.toml (the pin).
          toolchain: 1.98.1

      - uses: Swatinem/rust-cache@v2

      - name: Stub frontend/dist (skip-build mode)
        run: |
          mkdir -p frontend/dist
          echo "<!doctype html><title>stub</title>" > frontend/dist/index.html

      - name: Run tests
        run: cargo test --workspace

  # The database-backed tests (`#[ignore = "requires Docker"]` / `"needs
  # Docker"`), which `cargo test --workspace` skips. The selection, and what is
  # left out on purpose (LocalStack, NATS, measurements, Java, Go), is in
  # scripts/db-tests.sh; CLAUDE.md says how to run it locally. A Postgres
  # service container serves the tests that go through `support::start_db`
  # (a database each, on FC_TEST_DATABASE_URL); the rest start their own
  # containers (testcontainers) on the runner's Docker. The script fails if a
  # test fails or if fewer than its floor of tests ran.
  database-tests:
    name: Database tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_SPLIT_DEBUGINFO: unpacked
      FC_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          # Keep in step with rust-toolchain.toml (the pin).
          toolchain: 1.98.1

      - uses: Swatinem/rust-cache@v2

      - name: Stub frontend/dist (skip-build mode)
        run: |
          mkdir -p frontend/dist
          echo "<!doctype html><title>stub</title>" > frontend/dist/index.html

      # The checked queries' metadata (`.sqlx/`) must match the code and the
      # migrated schema: a stale or missing entry fails here. The script
      # migrates the (empty) service database with the application's own
      # runner, then runs `cargo sqlx prepare --workspace --check`. sqlx-cli
      # is a build tool, not a dependency (pinned, locked).
      - name: Install sqlx-cli
        run: cargo install --locked sqlx-cli --version =0.8.6 --no-default-features --features rustls,postgres

      - name: Checked-query metadata is up to date
        env:
          FC_SQLX_DATABASE_URL: ${{ env.FC_TEST_DATABASE_URL }}
        run: ./scripts/sqlx-prepare.sh --check

      - name: Database tests
        run: ./scripts/db-tests.sh

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      # `packageManager` field lives in frontend/package.json, not the
      # repo-root package.json — point pnpm/action-setup at it explicitly.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  # Supply-chain guardrails (docs/operations/supply-chain.md): RustSec
  # advisories, licences, duplicate/banned crates and sources (cargo-deny),
  # and audits of every third-party crate (cargo-vet). Tools are pinned by
  # version; cargo-deny's release archive is also pinned by checksum, and
  # cargo-vet is built from crates.io with its own lockfile (`--locked`).
  supply-chain:
    name: Supply chain (cargo-deny, cargo-vet)
    runs-on: ubuntu-latest
    env:
      CARGO_DENY_VERSION: "0.20.2"
      CARGO_DENY_SHA256: "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f"
      CARGO_VET_VERSION: "0.10.2"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          # Keep in step with rust-toolchain.toml (the pin).
          toolchain: 1.98.1

      - name: Install cargo-deny (pinned, checksum-verified)
        run: |
          set -euo pipefail
          name="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl"
          curl -sSfL -o /tmp/cargo-deny.tar.gz \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/${name}.tar.gz"
          echo "${CARGO_DENY_SHA256}  /tmp/cargo-deny.tar.gz" | sha256sum -c -
          tar -xzf /tmp/cargo-deny.tar.gz -C /tmp
          install -m 0755 "/tmp/${name}/cargo-deny" "$HOME/.cargo/bin/cargo-deny"

      - name: Cache cargo-vet
        id: vet-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-vet
          key: cargo-vet-${{ env.CARGO_VET_VERSION }}-${{ runner.os }}

      - name: Install cargo-vet (pinned, locked)
        if: steps.vet-cache.outputs.cache-hit != 'true'
        run: cargo install --locked "cargo-vet@${CARGO_VET_VERSION}"

      - name: cargo deny (workspace)
        run: cargo deny --locked check

      - name: cargo deny (SDK and guest-crate licences)
        run: |
          set -euo pipefail
          for manifest in crates/fc-sdk/Cargo.toml crates/fc-function-abi/Cargo.toml \
                          crates/fc-function-model/Cargo.toml crates/fc-function-pdk/Cargo.toml; do
            echo "::group::${manifest}"
            cargo deny --manifest-path "$manifest" --all-features --exclude-dev --locked \
              --config deny-sdk.toml check licenses
            echo "::endgroup::"
          done

      - name: cargo vet
        run: cargo vet --locked
