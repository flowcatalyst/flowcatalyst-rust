name: Publish Docker Image

on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'bin/**'
      - 'frontend/**'
      - 'migrations/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Dockerfile'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/flowcatalyst/flowcatalyst-rust

jobs:
  publish:
    name: Build & Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine tags
        id: tags
        run: |
          TAGS="$IMAGE:${{ github.sha }},${IMAGE}:latest"
          if [[ "${{ github.event_name }}" == "release" ]]; then
            TAGS="$TAGS,$IMAGE:${{ github.event.release.tag_name }}"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Build and push
        run: |
          IFS=',' read -ra TAG_ARGS <<< "${{ steps.tags.outputs.tags }}"
          TAG_FLAGS=""
          for tag in "${TAG_ARGS[@]}"; do
            TAG_FLAGS="$TAG_FLAGS -t $tag"
          done

          # The version fc-server reports (owner decision #33).
          FC_BUILD_VERSION="${{ github.event.release.tag_name || github.sha }}"
          docker build \
            --platform linux/amd64 \
            -f Dockerfile \
            --build-arg FC_BUILD_VERSION="$FC_BUILD_VERSION" \
            $TAG_FLAGS \
            .

          for tag in "${TAG_ARGS[@]}"; do
            docker push "$tag"
          done
