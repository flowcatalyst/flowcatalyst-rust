# Licence policy for the crates an application links into its own code: the
# Rust SDK (fc-sdk and its fc-common-types, Apache-2.0) and the function
# guest crates (fc-function-abi, fc-function-model, fc-function-pdk;
# MPL-2.0). An application that uses them must not be pulled under a strong
# copyleft licence, so the AGPL the platform carries, and GPL/LGPL, are not
# allowed here.
#
# Run per crate, normal dependencies only (CI's `supply-chain` job does):
#   cargo deny --manifest-path crates/fc-sdk/Cargo.toml --all-features \
#     --exclude-dev --config deny-sdk.toml check licenses
# for fc-sdk, fc-function-abi, fc-function-model and fc-function-pdk.
# Everything else (advisories, bans, sources) is deny.toml's job.

[graph]
all-features = true
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "wasm32-wasip2",
]

[licenses]
confidence-threshold = 0.9
unused-allowed-license = "allow"
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "CC0-1.0",
    "BSL-1.0",
    "Unlicense",
    "MPL-2.0",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
]
# No exceptions. fc-sdk's shared types (outbox status and item types, TSIDs,
# audit redaction) live in the Apache-2.0 fc-common-types, not the AGPL
# fc-common (owner decision #51). Do not add an AGPL exception here: move the
# code to a permissively licensed crate instead.
exceptions = []

[licenses.private]
ignore = false
