# Clippy configuration for the workspace.

# `clippy::absolute_paths` (enabled in each crate's `[lints.clippy]`): a path
# that starts at a crate root (`std::…`, `crate::…`, `fc_platform_core::…`)
# may have at most two segments; import the item, or its module, instead
# (CLAUDE.md "Imports"). Handler paths inside `routes!(…)` stay fully
# qualified for the route-auth scanner: the `routes.rs` files and
# `router.rs` allow the lint.
absolute-paths-max-segments = 2

# `clippy::result_large_err`: a handler helper that returns
# `Result<T, axum::response::Response>` has its finished HTTP response as the
# error (an early return from a handler). `Response<Body>` is 128 bytes on
# this toolchain, which is exactly the lint's default threshold, so every such
# helper fires; boxing the response would change each caller's `?`/`return`.
# 160 stays well under what a genuinely oversized error enum would weigh.
large-error-threshold = 160
